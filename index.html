<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0b0d; color: #ededf0;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { text-align: center; padding: 2rem; max-width: 34rem; }
    .symbol {
      margin: 0 auto 1.5rem; width: 4.5rem; height: 4.5rem;
      border: 2px solid #777; border-radius: 50%;
      display: grid; place-items: center; font-size: 2.3rem; color: #aaa;
    }
    h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: .04em; }
    p { margin: 0; color: #a8a8b0; line-height: 1.6; }
    .code { margin-top: 1.5rem; font-size: .8rem; letter-spacing: .18em; color: #666; }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">×</div>
    <h1>Access Denied</h1>
    <p>You don't have permission to access this page.</p>
    <div class="code">ERROR 403 · FORBIDDEN</div>
  </main>
</body>
</html>
